name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        # GITHUB_SHA를 사용하여 매번 고유한 태그를 생성합니다.
        tags: ${{ secrets.DOCKER_USERNAME }}/back:${{ github.sha }}

    # [선택사항] 여기서 'chart' 레포의 values.yaml을 자동으로 수정하는 단계를 추가할 수 있습니다.
    # 지금은 우선 수동으로 values.yaml의 tag만 수정해보세요!
