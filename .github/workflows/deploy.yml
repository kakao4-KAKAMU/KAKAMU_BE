name: Build and Push Docker Image

on:
  push:
    branches: [ "dev" ] # main 브랜치로 push (merge) 될 때 동작
    paths-ignores: # 아래 파일은 제외
      - '**.md'
      - '.gitignore'

jobs:
  build-and-push:
    runs-on: ubuntu-latest # 우분투 사용
    steps:
    - name: Checkout code # 1. 깃허브 코드 다운
      uses: actions/checkout@v4

    - name: Login to Docker Hub # 2. 도커 허브 로그인
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set short SHA
      run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

    - name: Docker Build
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false # 빌드만 수행함
        load: true # 깃허브 액션 러너로 가져옴 후에 Push 하기 위해서
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/filma-backend:latest
          ${{ secrets.DOCKER_USERNAME }}/filma-backend:${{ env.SHORT_SHA }}
          ${{ secrets.DOCKER_USERNAME }}/filma-backend:1.${{ github.run_number }}

    - name: Run Trivy for Security Report # 보안 리포트 생성
      uses: aquasecurity/trivy-action@dea62cf79abc269fc35dfd161a4539f0d1f92293 # 트리비 0.70 버전
      with:
        image-ref: '${{ secrets.DOCKER_USERNAME }}/filma-backend:${{ env.SHORT_SHA }}'
        format: 'table'
        exit-code: '0' # 문제가 발견되도 무시
        severity: "MEDIUM,HIGH,CRITICAL" # MEDIUM 이상 위험도 검출
        ignore-unfixed: false


    - name: Docker push
      env:
        docker_user: ${{ secrets.DOCKER_USERNAME }}
        sha: ${{ env.SHORT_SHA }}
        number: ${{ github.run_number }}
      run: |
        docker push $docker_user/filma-backend:latest
        docker push $docker_user/filma-backend:$sha
        docker push $docker_user/filma-backend:1.$number

    - name: Checkout Helm Chart Repo
      uses: actions/checkout@v4 # helm repo 코드 다운
      with:
        repository: kakao4-KAKAMU/kakamu_helm # 헬름 차트 깃허브 레포
        token: ${{ secrets.HELM_REPO_TOKEN }} # 레포 권한이 있는 토큰
        path: helm-charts
        ref: dev # dev 브랜치를 checkout
          
    - name: Update Helm Values # 백엔드 values.yaml 이미지 태그값 검증 후 변경 + dev 브랜치로 push
      run: |
        SHORT_SHA=${GITHUB_SHA::7}
        
        cd helm-charts/environments/dev/back
        yq -i ".image.tag = \"$SHORT_SHA\"" values.yaml
        
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        git add values.yaml
        
        if ! git diff --cached --quiet; then
          git commit -m "update backend image tag to $SHORT_SHA"
          git push origin HEAD:dev
        else
          echo "No changes to commit"
        fi        
        
        
